<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">        
        
    </head>
    <body>
        <div class="top-container">
            <div class="top-content">
                <p>✨ Place your order ✨</p>
                </div>
        </div>
    
        <div class="main-container">

            <div class="category-container">
                <div class="category-content">
                    <button id="color-button" class="category-button">
                        <p>Color</p>
                    </button>
                    <button id="design-button" class="category-button">
                        <p>Design</p>
                    </button>
                    <button id="drink-button" class="category-button">
                        <p>Drink</p>
                    </button>
                </div>
            </div>
            
            <div class="order-container">
                <div class="order-content">
                    <img id="color" src="resources/color/white.png" class="order-img">
                    <img id="design" src="resources/design/none.png" class="order-img">
                    <img id="drink" src="resources/drink/none.png" class="order-img">
                </div>
            </div>

            <div class="options-container">
                <div id="color-options" class="options-grid" style="display: grid;">
                    <button id="color-1" class="options-img">
                        <img src="resources/color/options/black.png">
                        <p>black</p>
                    </button>
                    <button id="color-2" class="options-img">
                        <img src="resources/color/options/blue.png">
                        <p>blue</p>
                    </button>
                    <button id="color-3" class="options-img">  
                        <img src="resources/color/options/green.png">
                        <p>green</p>
                    </button>
                    <button id="color-4" class="options-img">
                        <img src="resources/color/options/orange.png">
                        <p>orange</p>
                    </button>
                    <button id="color-5" class="options-img">
                        <img src="resources/color/options/pink.png">
                        <p>pink</p>
                    </button>
                    <button id="color-6" class="options-img">
                        <img src="resources/color/options/purple.png">
                        <p>purple</p>
                    </button>
                    <button id="color-7" class="options-img">
                        <img src="resources/color/options/red.png">
                        <p>red</p>
                    </button>
                    <button id="color-8" class="options-img">
                        <img src="resources/color/options/white.png">
                        <p>white</p>
                    </button>
                    <button id="color-9" class="options-img">
                        <img src="resources/color/options/yellow.png">
                        <p>yellow</p>
                    </button>
                </div> 

                <div id="design-options" class="options-grid" style="display: none;">
                    <button id="design-0" class="options-img">
                        <img src="resources/design/options/none.png">
                        <p>no design</p>
                    </button>
                    <button id="design-1" class="options-img">
                        <img src="resources/design/options/clouds.png">
                        <p>clouds</p>
                    </button>
                    <button id="design-2" class="options-img">
                        <img src="resources/design/options/flowers.png">
                        <p>flowers</p>
                    </button>
                    <button id="design-3" class="options-img">      
                        <img src="resources/design/options/frog.png">
                        <p>frog</p>
                        </button>
                    <button id="design-4" class="options-img">
                        <img src="resources/design/options/plants.png">
                        <p>plants</p>
                    </button>
                    <button id="design-5" class="options-img">
                        <img src="resources/design/options/strawberries.png">
                        <p>strawberries</p>
                    </button>
                </div>
                
                <div id="drink-options" class="options-grid" style="display: none;">
                    <button id="drink-0" class="options-img">
                        <img src="resources/drink/options/none.png">
                        <p>no drink</p>
                    </button>
                    <button id="drink-1" class="options-img">
                        <img src="resources/drink/options/coffee.png">
                        <p>coffee</p>
                    </button>
                    <button id="drink-2" class="options-img">
                        <img src="resources/drink/options/chai-latte.png">
                        <p>chai latte</p>
                    </button>
                    <button id="drink-3" class="options-img">  
                        <img src="resources/drink/options/matcha-latte.png">
                        <p>matcha latte</p>
                        </button>
                    <button id="drink-4" class="options-img">
                        <img src="resources/drink/options/pink-latte.png">
                        <p>pink latte</p>
                    </button>
                    <button id="drink-5" class="options-img">
                        <img src="resources/drink/options/ube-latte.png">
                        <p>ube latte</p>
                    </button>
                    <button id="drink-6" class="options-img">
                        <img src="resources/drink/options/green-tea.png">
                        <p>green tea</p>
                    </button>
                </div> 
            </div>


        </div>
        <script type="text/javascript" src="index.js"></script>
    </body>
</html>
